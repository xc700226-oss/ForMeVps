# JP + SG + KR 自建节点 + 原订阅分流规则（整合版）
# 来源：你上传的 RWcxzQDQCzsb.yaml
# 已删除原机场所有节点，保留自建 JP-Tokyo、SG-Singapore 与 KR-Korea。
# 分流策略：
#   PROXY：OpenAI / Google / Telegram / Netflix / Spotify / TikTok / Discord /
#          Bahamut / Speedtest / GFWList 等
#   DIRECT：Bilibili / Steam / Apple / Microsoft / 中国大陆 / 本地网段
# 注意：rule-providers 仍会从原配置中的远程 URL 下载规则集。
port: 7890
socks-port: 7891
mixed-port: 7892
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
ipv6: false
find-process-mode: strict
external-controller: 127.0.0.1:9090
profile:
  store-selected: true
  store-fake-ip: true
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
ntp:
  enable: true
  write-to-system: false
  server: ntp.aliyun.com
  port: 123
  interval: 30
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
dns:
  enable: true
  listen: :53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  prefer-h3: false
  respect-rules: true
  use-hosts: false
  use-system-hosts: false
  ipv6: true
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.arpa'
  - time.*.com
  - ntp.*.com
  - +.market.xiaomi.com
  - localhost.ptlogin2.qq.com
  - '*.msftncsi.com'
  - www.msftconnecttest.com
  default-nameserver:
  - system
  - 223.6.6.6
  - 8.8.8.8
  - 2400:3200::1
  - 2001:4860:4860::8888
  nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  - 8.8.8.8
  direct-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  - 223.5.5.5
  - 119.29.29.29
  direct-nameserver-follow-policy: true
  fallback:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
    domain:
    - +.google.com
    - +.facebook.com
    - +.youtube.com
    - +.twitter.com
    - +.github.com
  proxy-server-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  - tls://223.5.5.5
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
  - any:53
  device: SakuraiTunnel
  mtu: 1500
  endpoint-independent-nat: true
proxies:
- name: JP-Tokyo
  type: vless
  server: 139.180.198.50
  port: 443
  uuid: d9e705da-3f4a-43da-9be2-cb8d5766a671
  network: tcp
  tls: true
  udp: true
  flow: xtls-rprx-vision
  servername: www.apple.com
  reality-opts:
    public-key: CTJZlK_jEEcJLJzLcobHVsZ3ZglVuyHYEF4fOej_yGA
    short-id: 19a9ec02f0336b03
  client-fingerprint: chrome
- name: SG-Singapore
  type: vless
  server: 66.42.62.160
  port: 443
  uuid: 327ff0ac-b4c7-4785-9d8a-72eba7547eaf
  network: tcp
  tls: true
  udp: true
  flow: xtls-rprx-vision
  servername: www.apple.com
  reality-opts:
    public-key: dOBMKZvGCDKOltzZEfaZcOazq3HSWDA8DtbGzSmaBm0
    short-id: b8a66a5b05462b93
  client-fingerprint: chrome
- name: KR-Korea
  type: vless
  server: 141.164.43.123
  port: 443
  uuid: 174522a8-c6cd-499e-893d-61ab7028bfe9
  network: tcp
  tls: true
  udp: true
  flow: xtls-rprx-vision
  servername: www.apple.com
  reality-opts:
    public-key: bibY5V7ZXOfSAWVLtOGW_EwFcRxB35q_d6xZTkh6Bg8
    short-id: 55e081b89fbda51d
  client-fingerprint: chrome
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - KR-Korea
  - SG-Singapore
  - JP-Tokyo
  - DIRECT
